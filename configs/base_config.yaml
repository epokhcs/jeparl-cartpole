# Base Configuration for JEPA-RL CartPole

experiment:
  name: "jepa_cartpole"
  seed: 42
  num_runs: 5
  device: "cuda"  # or "cpu" or "mps" for Mac

environment:
  name: "CartPole-v1"
  render_size: [600, 400]  # width, height
  frame_stack: 3  # Last 3 frames for context
  normalize_pixels: true
  pad_to: [608, 400]  # Pad for clean patch division

model:
  d_emb: 64  # Embedding dimension
  patch_size: 16
  num_heads: 4
  num_layers: 4
  dropout: 0.1
  momentum: 0.99  # For Y-encoder EMA updates

predictor:
  hidden_dim: 128
  num_layers: 2

training:
  total_steps: 100000
  rollout_steps: 2048  # Steps per rollout
  ppo_epochs: 4
  mini_batch_size: 64
  learning_rate: 3.0e-4
  gamma: 0.99  # Discount factor
  gae_lambda: 0.95  # GAE parameter
  clip_epsilon: 0.2  # PPO clip parameter
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 0.5

losses:
  jepa_weight: 1.0
  actor_weight: 1.0
  critic_weight: 0.5
  reg_weight: 0.1

logging:
  log_interval: 1000  # Steps between logging
  eval_interval: 5000  # Steps between evaluation
  save_interval: 10000  # Steps between checkpoints
  wandb_project: "jepa-rl"
  wandb_entity: null  # Set to your wandb username
  use_tensorboard: true
  use_wandb: false  # Set to true if you have wandb configured

# Configuration type: 1, 2, 3, or 4
# 1: Baseline (no JEPA, RL gradients)
# 2: JEPA + RL gradients (best)
# 3: JEPA without RL gradients (collapses)
# 4: JEPA + regularization, no RL gradients
configuration:
  type: 2
  use_jepa: true
  use_rl_gradients: true
  use_regularization: false

# Collapse detection
collapse:
  variance_threshold: 0.01  # Below this indicates collapse
  check_interval: 100  # Check every N steps
